<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earwormed</title>
<meta name="description" content="Your Spotify week, month and year in one place. See what got stuck in your head.">
<meta name="theme-color" content="#F3F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earwormed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column. A flat colour block per period leads, then stat tiles, charts and ranked lists. */
:root{
  color-scheme:light dark;
  --bg:#F3F2F7; --surface:#FFFFFF; --line:#DCD9E6; --grid:#E6E3EE;
  --fg:#16141F; --muted:#625C74; --base-bar:#B9B4C8;
  --week:#D6246E; --month:#2F5BE0; --year:#0E7C66;
  --week-a:#C41E63; --month-a:#2F5BE0; --year-a:#0E7C66;
  --warn-bg:#FFF1D6; --warn-fg:#6B4200;
  --accent:var(--week-a); --hero:var(--week);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F0E15; --surface:#1A1823; --line:#2C2938; --grid:#262331;
    --fg:#F1EFF7; --muted:#A39EB5; --base-bar:#4A455C;
    --week-a:#F2619A; --month-a:#86A2FF; --year-a:#45CDAA;
    --warn-bg:#3A2C10; --warn-fg:#FFD58A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.45 var(--f-body);
  padding-top:max(20px,env(safe-area-inset-top,0px));
  padding-bottom:max(48px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:600px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 0 2px}
header>div:first-child{flex:1 1 210px;min-width:0}
h1{font:800 clamp(28px,9vw,36px)/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:8px 0 0;font-size:13px}
.hbtns{display:flex;gap:6px;flex:none}
.sbtn{min-height:40px;padding:0 13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;font:600 13px var(--f-body);cursor:pointer}
.btn{min-height:48px;padding:0 20px;border:0;background:var(--fg);color:var(--bg);border-radius:12px;font:700 15px var(--f-body);cursor:pointer;width:100%}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.warn{background:#B3261E;color:#fff}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tabs button{flex:1;min-height:44px;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible,.col:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{display:grid;gap:14px;min-width:0}
#view[data-p="week"]{--accent:var(--week-a);--hero:var(--week)}
#view[data-p="month"]{--accent:var(--month-a);--hero:var(--month)}
#view[data-p="year"]{--accent:var(--year-a);--hero:var(--year)}

.hero{background:var(--hero);color:#fff;border-radius:16px;padding:22px 20px 20px;min-width:0}
.hero .k{font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.hero .big{font:800 46px/.98 var(--f-display);text-transform:uppercase;margin:10px 0 6px;overflow-wrap:anywhere;text-wrap:balance}
.hero .by{font-size:16px;font-weight:500}
.hero .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.24);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}
a.pill:hover{background:rgba(0,0,0,.36)}
.hero a:focus-visible{outline-color:#fff}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font:800 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.seg{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;flex:none}
.seg button{min-height:32px;padding:0 11px;border:0;background:none;color:var(--muted);font:600 12px var(--f-body);border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chead.c{align-items:center}
.grows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:14px}
.grow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center}
.grow .gn{font-weight:600;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gm{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:6px}
.grow .gm i{display:block;height:100%;background:var(--accent);border-radius:4px}
.peak{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.chart{position:relative;padding-top:8px}
.bars{display:grid;gap:3px;height:140px;align-items:end;border-bottom:1px solid var(--line);background:linear-gradient(var(--grid),var(--grid)) 0 0/100% 1px no-repeat}
.col{display:flex;align-items:flex-end;height:140px;border-radius:4px 4px 0 0}
.col:hover,.col:focus-visible{background:var(--grid)}
.bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.bar.zero{border-radius:0}
.labs{display:grid;gap:3px;margin-top:6px}
.lab{text-align:center;font-size:11px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.lab span{display:block;min-height:13px}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;pointer-events:none;width:max-content;max-width:min(260px,100%);text-align:center;z-index:2}
[hidden]{display:none!important}

.hrows{display:grid;gap:9px;margin-top:2px}
.hrow{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.hrow .m{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.hrow .m i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hrow .n{text-align:right;color:var(--muted)}

.rows{list-style:none;margin:10px 0 0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.row{display:grid;grid-template-columns:24px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;color:inherit;text-decoration:none}
a.row:hover .t b{text-decoration:underline}
.rk{font:800 22px/1 var(--f-display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.cov{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--grid);display:block}
.cov.round{border-radius:50%}
.t{min-width:0}
.t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--bg)}
a.chip:hover{border-color:var(--accent)}

.setup h2.big{font:800 28px/1.05 var(--f-display);text-transform:uppercase;color:var(--fg);letter-spacing:0;margin:0 0 6px}
.setup p{margin:8px 0 0;color:var(--muted)}
.setup ol{margin:14px 0 0;padding-left:20px;display:grid;gap:10px}
.setup li{padding-left:4px}
.setup code,.uri{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:block;margin-top:6px;overflow-wrap:anywhere;user-select:all}
.setup input{width:100%;min-height:48px;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 12px;font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace}
.setup .btn{margin-top:12px}
.stack{display:grid;gap:10px;margin-top:14px}
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:14px}
.banner button{margin-top:8px}
.card .note{margin-top:12px}
.note{font-size:12.5px;color:var(--muted);margin:2px 2px 0;max-width:60ch}
.empty strong{display:block;font:800 26px/1.05 var(--f-display);text-transform:uppercase}
.empty p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.link{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app"><section class="card"><h2>Loading</h2></section></div>

<script>
(function () {
  "use strict";
  var PERIODS = { week: "Week", month: "Month", year: "Year" };
  var REDIR = location.origin + "/";
  var SCOPES = "user-read-recently-played user-top-read";
  var HIST_CAP = 8000;
  var st = { tab: "week", status: "idle", err: null, settings: false, confirm: "", updated: 0 };
  var app = document.getElementById("app");

  /* ---------- small helpers ---------- */
  function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function E(code, msg) { var e = new Error(msg || code); e.code = code; return e; }
  function h(tag, props) {
    var el = document.createElement(tag), k, v, i, c;
    if (props) {
      for (k in props) {
        v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    for (i = 2; i < arguments.length; i++) {
      c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function isoLocal(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function fmtDay(d) { return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }
  function cid() { return get("lw_cid", ""); }
  function srvKey() { return get("lw_srv", ""); }
  function signedIn() { return !!(get("lw_tok", null) || srvKey()); }
  function srvPost(path) {
    var k = srvKey();
    if (!k) return Promise.resolve();
    return fetch("/api/" + path, { method: "POST", headers: { "x-key": k } }).catch(function () {});
  }
  function enroll(refresh) {
    /* Hand the sign-in to the server so it can log plays in the background. Falls back to on-device mode if the server isn't there. */
    var a = new Uint8Array(24), key = "", i;
    crypto.getRandomValues(a);
    for (i = 0; i < a.length; i++) key += (a[i] < 16 ? "0" : "") + a[i].toString(16);
    if (!refresh) return Promise.resolve(false);
    return fetch("/api/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: key, cid: cid(), refresh: refresh }) })
      .then(function (r) {
        if (r.ok) { set("lw_srv", key); del("lw_tok"); return true; }
        if (r.status === 403) st.err = E("denied", "Another device is already linked to this Earwormed site with a different Spotify account. Using on-device tracking instead.");
        return false;
      }).catch(function () { return false; });
  }
  function trackUrl(id) { return /^[A-Za-z0-9]{22}$/.test(id || "") ? "https://open.spotify.com/track/" + id : null; }
  function artistUrl(id) { return /^[A-Za-z0-9]{22}$/.test(id || "") ? "https://open.spotify.com/artist/" + id : null; }

  /* ---------- Spotify sign-in (Authorization Code with PKCE) ---------- */
  function randStr(n) {
    var cs = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~", a = new Uint8Array(n), o = "", i;
    crypto.getRandomValues(a);
    for (i = 0; i < n; i++) o += cs.charAt(a[i] % cs.length);
    return o;
  }
  function sha256b64(s) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (d) {
      var b = new Uint8Array(d), t = "", i;
      for (i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
      return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    });
  }
  function connect() {
    var v = randStr(64), s = randStr(16);
    set("lw_v", v); set("lw_s", s);
    sha256b64(v).then(function (ch) {
      var q = new URLSearchParams({
        client_id: cid(), response_type: "code", redirect_uri: REDIR, scope: SCOPES,
        code_challenge_method: "S256", code_challenge: ch, state: s
      });
      location.assign("https://accounts.spotify.com/authorize?" + q.toString());
    });
  }
  function tokenReq(body) {
    return fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(body).toString()
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw E("token", (j.error_description || j.error || String(r.status)));
        return j;
      });
    });
  }
  function saveTok(j, old) {
    set("lw_tok", { a: j.access_token, r: j.refresh_token || (old && old.r) || "", e: Date.now() + (j.expires_in || 3600) * 1000 - 60000 });
  }
  function handleCallback() {
    var p = new URLSearchParams(location.search);
    if (!p.has("code") && !p.has("error")) return Promise.resolve(false);
    var code = p.get("code"), state = p.get("state"), error = p.get("error");
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    if (error) { st.err = E("denied", "Spotify sign-in was cancelled or refused (" + error + ")."); return Promise.resolve(true); }
    if (state !== get("lw_s", "")) { st.err = E("state", "That sign-in didn't match this device. Tap Connect Spotify to try again."); return Promise.resolve(true); }
    return tokenReq({ grant_type: "authorization_code", code: code, redirect_uri: REDIR, client_id: cid(), code_verifier: get("lw_v", "") })
      .then(function (j) { saveTok(j, null); del("lw_v"); del("lw_s"); return enroll(j.refresh_token).then(function () { return true; }); })
      .catch(function (e) { st.err = E("token", "Couldn't finish signing in to Spotify (" + e.message + ")."); return true; });
  }
  var refreshing = null;
  function ensureToken() {
    var t = get("lw_tok", null);
    if (!t) return Promise.reject(E("signed-out"));
    if (Date.now() < t.e) return Promise.resolve(t.a);
    if (!refreshing) {
      refreshing = tokenReq({ grant_type: "refresh_token", refresh_token: t.r, client_id: cid() })
        .then(function (j) { saveTok(j, t); refreshing = null; return get("lw_tok", {}).a; })
        .catch(function (e) { refreshing = null; del("lw_tok"); throw E("signed-out", e.message); });
    }
    return refreshing;
  }
  function api(path, retried) {
    return ensureToken().then(function (tok) {
      return fetch("https://api.spotify.com/v1" + path, { headers: { Authorization: "Bearer " + tok } });
    }).then(function (r) {
      if (r.status === 401 && !retried) {
        var t = get("lw_tok", null);
        if (t) { t.e = 0; set("lw_tok", t); }
        return api(path, true);
      }
      if (r.status === 429) throw E("rate");
      if (r.status === 403) throw E("forbidden");
      if (!r.ok) throw E("http", "Spotify answered " + r.status);
      return r.json();
    });
  }

  /* ---------- data ---------- */
  function pickImg(images) {
    var a = (images || []).filter(function (x) { return x && x.url; }).sort(function (x, y) { return (x.width || 0) - (y.width || 0); }), i;
    for (i = 0; i < a.length; i++) if ((a[i].width || 0) >= 60) return a[i].url;
    return a.length ? a[a.length - 1].url : "";
  }
  function slimT(x) {
    var ar = x.artists || [], al = x.album || {}, y = parseInt(String(al.release_date || "").slice(0, 4), 10);
    return {
      id: x.id, n: x.name || "", a: ar.map(function (q) { return q.name; }).join(", "), a1: ar[0] ? ar[0].name : "",
      au: ar[0] ? ar[0].id : "", d: x.duration_ms || 0, i: pickImg(al.images), y: isNaN(y) ? 0 : y
    };
  }
  function slimA(x) { return { id: x.id, n: x.name || "", i: pickImg(x.images) }; }

  function merge(items) {
    var hist = get("lw_hist", []), seen = {}, added = [], latest = hist.length ? hist[hist.length - 1].p : "", oldest = "";
    hist.forEach(function (r) { seen[r.p + "|" + r.t] = 1; });
    items.forEach(function (it) {
      if (!it || !it.track || !it.track.id || !it.played_at) return;
      if (!oldest || it.played_at < oldest) oldest = it.played_at;
      var k = it.played_at + "|" + it.track.id;
      if (seen[k]) return;
      seen[k] = 1;
      var s = slimT(it.track);
      added.push({ p: it.played_at, t: s.id, n: s.n, a: s.a, a1: s.a1, au: s.au, d: s.d, i: s.i, y: s.y });
    });
    if (hist.length && items.length >= 50 && oldest > latest) {
      var gaps = get("lw_gaps", []);
      gaps.push({ from: latest, to: oldest });
      set("lw_gaps", gaps.slice(-20));
    }
    if (added.length) {
      hist = hist.concat(added).sort(function (a, b) { return a.p < b.p ? -1 : a.p > b.p ? 1 : 0; });
      if (hist.length > HIST_CAP) hist = hist.slice(hist.length - HIST_CAP);
      set("lw_hist", hist);
    }
    return added.length;
  }

  function loadServer(force) {
    st.status = "loading"; render();
    return fetch("/api/data" + (force ? "?refresh=1" : ""), { headers: { "x-key": srvKey() }, cache: "no-store" }).then(function (r) {
      if (r.status === 401) { del("lw_srv"); throw E("signed-out"); }
      if (!r.ok) throw E("http", "Earwormed's server answered " + r.status);
      return r.json();
    }).then(function (j) {
      set("lw_hist", j.hist || []); set("lw_gaps", j.gaps || []);
      if (j.top) set("lw_cache", j.top);
      set("lw_gen", j.genres || {});
      st.srvErr = j.err || null; st.lastRun = j.lastRun || 0;
      st.status = "ready"; st.err = null; st.updated = Date.now(); render();
    }).catch(function (e) {
      st.err = e; st.status = "error"; render();
    });
  }
  function load(force) {
    if (srvKey()) return loadServer(force);
    st.status = "loading"; render();
    return ensureToken().then(function () {
      return api("/me/player/recently-played?limit=50");
    }).then(function (rec) {
      merge(rec.items || []);
      var c = get("lw_cache", null);
      if (!force && c && Date.now() - c.ts < 3600000) return;
      return Promise.all([
        api("/me/top/tracks?time_range=short_term&limit=50"),
        api("/me/top/artists?time_range=short_term&limit=50"),
        api("/me/top/tracks?time_range=long_term&limit=50"),
        api("/me/top/artists?time_range=long_term&limit=50")
      ]).then(function (r) {
        set("lw_cache", {
